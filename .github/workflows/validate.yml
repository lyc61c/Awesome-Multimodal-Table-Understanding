name: Validate bibliography

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate bibliography data
        run: node scripts/validate.mjs

      - name: Build generated README
        run: npm run build

      - name: Check generated README
        run: npm run check

      - name: Commit generated README
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "refresh generated bibliography [skip ci]"
          git push
